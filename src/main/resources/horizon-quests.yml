# ─────────────────────────────────────────────────────────────────────────────
# HorizonUtilities — Quest System Configuration
# Quests are generated PROCEDURALLY — infinite unique quests per player.
# The system picks random actions, targets, and amounts from Bukkit enums
# using a seed-based RNG. Same player + same day = same quests every time.
# No templates or predefined quests are needed.
# ─────────────────────────────────────────────────────────────────────────────

settings:
  enabled: true
  daily-reset-time: "00:00"       # 24h format, server timezone
  weekly-reset-day: MONDAY
  notify-on-assign: true
  notify-on-complete: true
  notify-on-step-complete: true
  auto-claim-rewards: true
  daily-money-cap: 5000.0         # Max money earnable from quests per day
  daily-item-reward-cap: 10       # Max item rewards per day
  challenge-repeat-block-days: 30 # Same challenge won't repeat for N days

# ─────────────────────────────────────────────────────────────────────────────
# Player Tier Formula
# tier = weighted combination of per-hour activity metrics + progression
# AFK players score low because per-hour metrics normalize idle time.
# All weights are tunable. Final tier clamped to [0, max-tier].
# ─────────────────────────────────────────────────────────────────────────────
tier:
  max-tier: 10.0

  # Raw playtime (low weight — prevents AFK inflation)
  play-hours-weight: 0.005

  # Blocks mined per hour
  mining-weight: 0.008
  mining-per-hour-cap: 200

  # Mobs killed per hour
  combat-weight: 0.015
  kills-per-hour-cap: 50

  # Walking + sprinting distance (km), NOT vehicles
  distance-weight: 0.002
  distance-cap-km: 500

  # Crafting table interactions per hour
  crafting-weight: 0.01
  crafting-per-hour-cap: 30

  # Survival skill: 1 - (deaths / kills), capped at 0
  survival-weight: 0.3

  # Average job level across all joined jobs
  job-level-weight: 0.04

  # Total prestige across all jobs
  prestige-weight: 0.2

  # Unique chunks explored
  exploration-weight: 0.5
  exploration-divisor: 500

  # Diversity bonus: fraction of activity categories that are non-trivial
  diversity-weight: 0.3
  diversity-blocks-threshold: 1000
  diversity-kills-threshold: 100
  diversity-distance-threshold: 50
  diversity-crafting-threshold: 200
  diversity-fishing-threshold: 50
  diversity-breeding-threshold: 20
  diversity-job-level-threshold: 10

# ─────────────────────────────────────────────────────────────────────────────
# Quest Counts — how many quests per category, scaled by tier
# count = floor(base + tier * per-tier), clamped to max
# ─────────────────────────────────────────────────────────────────────────────
quest-counts:
  job-daily:
    base: 1
    per-tier: 0.3
    max: 4
    min-tier: 0
  general-daily:
    base: 1
    per-tier: 0.2
    max: 3
    min-tier: 0
  weekly:
    base: 1
    per-tier: 0.15
    max: 3
    min-tier: 0
  challenge:
    base: 0
    per-tier: 0.15
    max: 2
    min-tier: 3.0

# Amount multiplier per tier unit: scaled_amount = base * (1 + tier * scale)
difficulty-scale: 0.12
# Reward multiplier per tier unit: scaled_reward = base * (1 + tier * scale)
reward-scale: 0.15

# ─────────────────────────────────────────────────────────────────────────────
# Boss Bar — shows quest progress as a boss bar on screen
# ─────────────────────────────────────────────────────────────────────────────
bossbar:
  enabled: true
  duration-seconds: 5            # How long the bar stays visible (0 = permanent)
  max-bars: 3                    # Max boss bars shown at once per player
  show-on-complete: true         # Show a "Complete!" bar when quest finishes
  complete-duration-seconds: 3   # How long the completion bar stays

  # MiniMessage format — placeholders: <icon> <quest> <description> <progress> <total>
  format: "<icon> <gray><quest></gray> <dark_gray>|</dark_gray> <white><description></white> <yellow><progress>/<total></yellow>"
  complete-format: "<icon> <green><bold><quest></bold> — Complete!</green>"

  # Bar overlay style: PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
  style: NOTCHED_10

  # Bar color per quest category: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  colors:
    job-daily: GREEN
    general-daily: YELLOW
    weekly: BLUE
    challenge: PURPLE
