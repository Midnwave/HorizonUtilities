# ─────────────────────────────────────────────────────────────────────────────
# HorizonUtilities — Homes Configuration
# ─────────────────────────────────────────────────────────────────────────────

# Default maximum homes when a player has no horizonutilities.homes.<n> node.
default-max-homes: 1

# Max homes are resolved from LuckPerms permissions:
#   horizonutilities.homes.<number>     (e.g. .5, .10, .25)
#   horizonutilities.homes.unlimited
# The highest numeric node the player effectively has wins, so higher LuckPerms
# group weights naturally override lower ones through inheritance.
# Examples:
#   /lp group default permission set horizonutilities.homes.1 true
#   /lp group vip     permission set horizonutilities.homes.5 true
#   /lp group mvp     permission set horizonutilities.homes.10 true
#   /lp group admin   permission set horizonutilities.homes.unlimited true

# Cooldown in seconds between teleporting to homes
teleport-cooldown-seconds: 5

# Warmup in seconds — player must stand still
teleport-warmup-seconds: 3

# Allow homes across different worlds
allow-cross-world: true

# Max character length for home names
max-name-length: 16
