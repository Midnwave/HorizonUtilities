# ─────────────────────────────────────────────────────────────────────────────
# HorizonUtilities Job — Hunter
# Earn money and XP by killing hostile mobs.
# spawner-allowed: false blocks rewards for mobs killed from a spawner.
# Global job settings live in jobs-config.yml.
# ─────────────────────────────────────────────────────────────────────────────

display-name: "Hunter"
icon: BOW
description: "Hunt monsters and collect drops"
max-level: 100
hourly-income-cap: -1

# spawner-allowed: false = no reward when the mob was spawned by a spawner block
actions:
  KILL:
    ZOMBIE:
      money: 2.96
      xp: 16.7
      spawner-allowed: false
    SKELETON:
      money: 2.96
      xp: 16.7
      spawner-allowed: false
    CREEPER:
      money: 6.00
      xp: 27.9
      spawner-allowed: false
    SPIDER:
      money: 2.09
      xp: 12.1
      spawner-allowed: false
    ENDERMAN:
      money: 11.95
      xp: 51.2
      spawner-allowed: false
    WITCH:
      money: 14.83
      xp: 65.1
      spawner-allowed: false
    DROWNED:
      money: 3.55
      xp: 20.5
      spawner-allowed: false
    HUSK:
      money: 3.55
      xp: 20.5
      spawner-allowed: false
    STRAY:
      money: 3.55
      xp: 20.5
      spawner-allowed: false
    BLAZE:
      money: 17.81
      xp: 74.4
      spawner-allowed: false
    MAGMA_CUBE:
      money: 6.00
      xp: 26.0
      spawner-allowed: false
    WITHER_SKELETON:
      money: 38.64
      xp: 148.8
      spawner-allowed: false
    GHAST:
      money: 29.71
      xp: 111.6
      spawner-allowed: false
    PILLAGER:
      money: 11.95
      xp: 46.5
      spawner-allowed: false
    VINDICATOR:
      money: 17.81
      xp: 74.4
      spawner-allowed: false
    # Mini-boss tier
    RAVAGER:
      money: 118.90
      xp: 418.5
      spawner-allowed: false

# Income multiplier bonus at milestone levels (e.g. 0.05 = +5% earnings)
perks:
  25: 0.05
  50: 0.10
  75: 0.10
  100: 0.15

# Daily quest pool. weight = relative draw chance (higher = more common).
quests:
  - id: hunter_zombie
    description: "Kill 25 zombies"
    action: KILL
    material: ZOMBIE
    amount: 25
    reward-money: 177.86
    reward-xp: 558.0
    weight: 5
    enabled: true
  - id: hunter_creeper
    description: "Kill 10 creepers"
    action: KILL
    material: CREEPER
    amount: 10
    reward-money: 222.04
    reward-xp: 697.5
    weight: 4
    enabled: true
  - id: hunter_blaze
    description: "Kill 15 blazes"
    action: KILL
    material: BLAZE
    amount: 15
    reward-money: 519.64
    reward-xp: 1627.5
    weight: 2
    enabled: true
