# ─────────────────────────────────────────────────────────────────────────────
# HorizonUtilities Job — Brewer
# Earn money and XP by brewing potions at a brewing stand.
# The material key is the potion effect type name (not a Bukkit Material).
# Global job settings live in jobs-config.yml.
# ─────────────────────────────────────────────────────────────────────────────

display-name: "Brewer"
icon: BREWING_STAND
description: "Brew potions for profit"
max-level: 100
hourly-income-cap: -1

# BREW fires when a potion batch completes in the brewing stand.
# Material keys map to PotionEffectType names (or "AWKWARD", "THICK", "MUNDANE").
actions:
  BREW:
    # Base potions — low reward
    AWKWARD:
      money: 3.55
      xp: 14.9
    THICK:
      money: 1.79
      xp: 7.4
    MUNDANE:
      money: 1.79
      xp: 7.4
    # Utility potions — mid reward
    SPEED:
      money: 7.14
      xp: 33.5
    STRENGTH:
      money: 10.68
      xp: 44.6
    HEALING:
      money: 10.68
      xp: 44.6
    FIRE_RESISTANCE:
      money: 14.83
      xp: 55.8
    WATER_BREATHING:
      money: 10.68
      xp: 44.6
    NIGHT_VISION:
      money: 8.32
      xp: 37.2
    # Premium potions — high reward
    INVISIBILITY:
      money: 13.07
      xp: 51.2
    REGENERATION:
      money: 14.83
      xp: 55.8
    # Negative potions — lower reward
    POISON:
      money: 7.14
      xp: 33.5
    WEAKNESS:
      money: 4.76
      xp: 22.3
    SLOWNESS:
      money: 4.76
      xp: 22.3

# Income multiplier bonus at milestone levels (e.g. 0.05 = +5% earnings)
perks:
  25: 0.05
  50: 0.10
  75: 0.10
  100: 0.15

# Daily quest pool. weight = relative draw chance (higher = more common).
quests:
  - id: brewer_speed
    description: "Brew 5 speed potions"
    action: BREW
    material: SPEED
    amount: 5
    reward-money: 267.14
    reward-xp: 837.0
    weight: 4
    enabled: true
  - id: brewer_healing
    description: "Brew 5 healing potions"
    action: BREW
    material: HEALING
    amount: 5
    reward-money: 311.78
    reward-xp: 976.5
    weight: 4
    enabled: true
  - id: brewer_fire
    description: "Brew 3 fire resistance potions"
    action: BREW
    material: FIRE_RESISTANCE
    amount: 3
    reward-money: 355.73
    reward-xp: 1116.0
    weight: 3
    enabled: true
