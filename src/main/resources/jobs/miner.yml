# ─────────────────────────────────────────────────────────────────────────────
# HorizonUtilities Job — Miner
# Earn money and XP by breaking ore and stone blocks underground.
# Global job settings live in jobs-config.yml.
# ─────────────────────────────────────────────────────────────────────────────

# Display name shown in the jobs GUI and action-bar messages
display-name: "Miner"
# Inventory icon for the jobs GUI (Bukkit Material name)
icon: IRON_PICKAXE
# Short description shown when browsing available jobs
description: "Mine ores and stone for profit"
# Maximum job level (overrides global max-level in jobs-config.yml if set)
max-level: 100
# Maximum money this job can earn per hour (-1 = no cap)
hourly-income-cap: -1

# Per-material rewards. money = currency per action, xp = job XP per action.
actions:
  BREAK:
    STONE:
      money: 0.58
      xp: 3.7
    COBBLESTONE:
      money: 0.44
      xp: 2.8
    COAL_ORE:
      money: 3.58
      xp: 14.9
    DEEPSLATE_COAL_ORE:
      money: 4.20
      xp: 16.7
    IRON_ORE:
      money: 5.91
      xp: 23.3
    DEEPSLATE_IRON_ORE:
      money: 7.14
      xp: 26.0
    COPPER_ORE:
      money: 4.79
      xp: 18.6
    DEEPSLATE_COPPER_ORE:
      money: 5.91
      xp: 22.3
    GOLD_ORE:
      money: 10.65
      xp: 41.9
    DEEPSLATE_GOLD_ORE:
      money: 13.13
      xp: 51.2
    LAPIS_ORE:
      money: 8.88
      xp: 35.3
    DEEPSLATE_LAPIS_ORE:
      money: 10.65
      xp: 40.9
    REDSTONE_ORE:
      money: 8.88
      xp: 35.3
    DEEPSLATE_REDSTONE_ORE:
      money: 10.65
      xp: 40.9
    DIAMOND_ORE:
      money: 35.76
      xp: 139.5
    DEEPSLATE_DIAMOND_ORE:
      money: 44.50
      xp: 162.8
    EMERALD_ORE:
      money: 53.52
      xp: 186.0
    DEEPSLATE_EMERALD_ORE:
      money: 65.33
      xp: 209.3
    ANCIENT_DEBRIS:
      money: 148.57
      xp: 465.0
    NETHER_GOLD_ORE:
      money: 5.91
      xp: 27.9
    NETHER_QUARTZ_ORE:
      money: 4.79
      xp: 22.3

# Income multiplier bonus at milestone levels (e.g. 0.05 = +5% earnings)
perks:
  25: 0.05
  50: 0.10
  75: 0.10
  100: 0.15

# Daily quest pool. weight = relative draw chance (higher = more common).
quests:
  - id: miner_coal
    description: "Mine 64 coal ore"
    action: BREAK
    material: COAL_ORE
    amount: 64
    reward-money: 179.03
    reward-xp: 558.0
    weight: 5
    enabled: true
  - id: miner_iron
    description: "Mine 32 iron ore"
    action: BREAK
    material: IRON_ORE
    amount: 32
    reward-money: 268.54
    reward-xp: 837.0
    weight: 4
    enabled: true
  - id: miner_diamond
    description: "Mine 5 diamond ore"
    action: BREAK
    material: DIAMOND_ORE
    amount: 5
    reward-money: 592.88
    reward-xp: 1860.0
    weight: 2
    enabled: true
  - id: miner_stone
    description: "Mine 256 stone"
    action: BREAK
    material: STONE
    amount: 256
    reward-money: 89.51
    reward-xp: 372.0
    weight: 6
    enabled: true
