# ─────────────────────────────────────────────────────────────────────────────
# HorizonUtilities Job — Crafter
# Earn money and XP by crafting items at a crafting table or smelting in a furnace.
# Global job settings live in jobs-config.yml.
# ─────────────────────────────────────────────────────────────────────────────

display-name: "Crafter"
icon: CRAFTING_TABLE
description: "Craft items and smelt materials"
max-level: 100
hourly-income-cap: -1

actions:
  # CRAFT — fires when the player takes a crafted result from a crafting table
  CRAFT:
    IRON_INGOT:
      money: 2.37
      xp: 11.2
    GOLD_INGOT:
      money: 4.76
      xp: 22.3
    DIAMOND:
      money: 14.83
      xp: 55.8
    IRON_SWORD:
      money: 4.76
      xp: 22.3
    IRON_PICKAXE:
      money: 5.93
      xp: 27.9
    IRON_AXE:
      money: 5.93
      xp: 27.9
    STONE_SWORD:
      money: 2.37
      xp: 11.2
    BOW:
      money: 4.76
      xp: 22.3
    ARROW:
      money: 0.30
      xp: 1.9
    BREAD:
      money: 1.19
      xp: 5.6
    BOOKSHELF:
      money: 7.14
      xp: 33.5
  # SMELT — fires when the player collects a smelted item from a furnace
  SMELT:
    IRON_INGOT:
      money: 1.79
      xp: 11.2
    GOLD_INGOT:
      money: 3.55
      xp: 18.6
    COOKED_BEEF:
      money: 1.47
      xp: 7.4
    COOKED_CHICKEN:
      money: 1.47
      xp: 7.4
    COOKED_PORKCHOP:
      money: 1.47
      xp: 7.4
    BRICK:
      money: 1.19
      xp: 5.6
    GLASS:
      money: 0.88
      xp: 4.7

# Income multiplier bonus at milestone levels (e.g. 0.05 = +5% earnings)
perks:
  25: 0.05
  50: 0.10
  75: 0.10
  100: 0.15

# Daily quest pool. weight = relative draw chance (higher = more common).
quests:
  - id: crafter_iron
    description: "Smelt 32 iron ingots"
    action: SMELT
    material: IRON_INGOT
    amount: 32
    reward-money: 177.86
    reward-xp: 558.0
    weight: 5
    enabled: true
  - id: crafter_bread
    description: "Craft 32 bread"
    action: CRAFT
    material: BREAD
    amount: 32
    reward-money: 118.81
    reward-xp: 372.0
    weight: 5
    enabled: true
  - id: crafter_gold
    description: "Smelt 16 gold ingots"
    action: SMELT
    material: GOLD_INGOT
    amount: 16
    reward-money: 267.14
    reward-xp: 837.0
    weight: 3
    enabled: true
