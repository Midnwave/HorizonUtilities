# ─────────────────────────────────────────────────────────────────────────────
# HorizonUtilities Job — Enchanter
# Earn money and XP by enchanting items at an enchanting table.
# The material key is the item category, not a specific material.
# Global job settings live in jobs-config.yml.
# ─────────────────────────────────────────────────────────────────────────────

display-name: "Enchanter"
icon: ENCHANTING_TABLE
description: "Enchant items and brew potions"
max-level: 100
hourly-income-cap: -1

# ENCHANT action keys are item categories matched by the enchantment listener
actions:
  ENCHANT:
    SWORD:
      money: 14.83
      xp: 74.4
    PICKAXE:
      money: 14.83
      xp: 74.4
    AXE:
      money: 14.83
      xp: 74.4
    SHOVEL:
      money: 9.50
      xp: 46.5
    BOW:
      money: 14.83
      xp: 74.4
    HELMET:
      money: 11.89
      xp: 55.8
    CHESTPLATE:
      money: 17.81
      xp: 83.7
    LEGGINGS:
      money: 14.83
      xp: 74.4
    BOOTS:
      money: 11.89
      xp: 55.8
    FISHING_ROD:
      money: 9.50
      xp: 46.5

# Income multiplier bonus at milestone levels (e.g. 0.05 = +5% earnings)
perks:
  25: 0.05
  50: 0.10
  75: 0.10
  100: 0.15

# Daily quest pool. weight = relative draw chance (higher = more common).
quests:
  - id: enchanter_sword
    description: "Enchant 5 swords"
    action: ENCHANT
    material: SWORD
    amount: 5
    reward-money: 355.73
    reward-xp: 1116.0
    weight: 4
    enabled: true
  - id: enchanter_pickaxe
    description: "Enchant 5 pickaxes"
    action: ENCHANT
    material: PICKAXE
    amount: 5
    reward-money: 355.73
    reward-xp: 1116.0
    weight: 4
    enabled: true
  - id: enchanter_armor
    description: "Enchant 3 chestplates"
    action: ENCHANT
    material: CHESTPLATE
    amount: 3
    reward-money: 445.01
    reward-xp: 1395.0
    weight: 3
    enabled: true
