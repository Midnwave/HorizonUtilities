# ─────────────────────────────────────────────────────────────────────────────
# HorizonUtilities Job — Farmer
# Earn money and XP by harvesting fully-grown crops.
# Uses FARM action (crop broken at full growth) and BREAK for berry bushes.
# Global job settings live in jobs-config.yml.
# ─────────────────────────────────────────────────────────────────────────────

display-name: "Farmer"
icon: GOLDEN_HOE
description: "Grow and harvest crops"
max-level: 100
hourly-income-cap: -1

actions:
  # FARM fires when a crop block is broken at full maturity
  FARM:
    WHEAT:
      money: 1.79
      xp: 9.3
    CARROTS:
      money: 1.79
      xp: 9.3
    POTATOES:
      money: 1.79
      xp: 9.3
    BEETROOTS:
      money: 2.37
      xp: 11.2
    MELON_SLICE:
      money: 1.19
      xp: 5.6
    PUMPKIN:
      money: 2.96
      xp: 14.9
    SUGAR_CANE:
      money: 1.19
      xp: 5.6
    COCOA_BEANS:
      money: 2.37
      xp: 11.2
    NETHER_WART:
      money: 3.55
      xp: 18.6
  # BREAK fires for berry bushes (no maturity check)
  BREAK:
    SWEET_BERRY_BUSH:
      money: 2.37
      xp: 11.2
    GLOW_BERRIES:
      money: 2.96
      xp: 14.9

# Income multiplier bonus at milestone levels (e.g. 0.05 = +5% earnings)
perks:
  25: 0.05
  50: 0.10
  75: 0.10
  100: 0.15

# Daily quest pool. weight = relative draw chance (higher = more common).
quests:
  - id: farmer_wheat
    description: "Harvest 128 wheat"
    action: FARM
    material: WHEAT
    amount: 128
    reward-money: 213.44
    reward-xp: 669.6
    weight: 5
    enabled: true
  - id: farmer_carrot
    description: "Harvest 64 carrots"
    action: FARM
    material: CARROTS
    amount: 64
    reward-money: 177.86
    reward-xp: 558.0
    weight: 5
    enabled: true
  - id: farmer_pumpkin
    description: "Harvest 16 pumpkins"
    action: FARM
    material: PUMPKIN
    amount: 16
    reward-money: 320.15
    reward-xp: 1004.4
    weight: 3
    enabled: true
