# ─────────────────────────────────────────────────────────────────────────────
# HorizonUtilities Job — Weaponsmith
# Earn money and XP by crafting and repairing weapons and armor.
# Focuses on the combat-tier items compared to the generic Crafter job.
# Global job settings live in jobs-config.yml.
# ─────────────────────────────────────────────────────────────────────────────

display-name: "Weaponsmith"
icon: IRON_SWORD
description: "Craft and repair weapons and armor"
max-level: 100
hourly-income-cap: -1

actions:
  # CRAFT — fires when the player takes a crafted result from a crafting table
  CRAFT:
    IRON_SWORD:
      money: 7.14
      xp: 32.6
    IRON_AXE:
      money: 7.14
      xp: 32.6
    IRON_HELMET:
      money: 8.32
      xp: 39.1
    IRON_CHESTPLATE:
      money: 11.89
      xp: 51.2
    IRON_LEGGINGS:
      money: 10.68
      xp: 46.5
    IRON_BOOTS:
      money: 8.32
      xp: 39.1
    # Diamond tier — premium reward
    DIAMOND_SWORD:
      money: 59.38
      xp: 260.4
    DIAMOND_AXE:
      money: 59.38
      xp: 260.4
    DIAMOND_HELMET:
      money: 47.57
      xp: 223.2
    DIAMOND_CHESTPLATE:
      money: 80.21
      xp: 325.5
    DIAMOND_LEGGINGS:
      money: 71.28
      xp: 279.0
    DIAMOND_BOOTS:
      money: 47.57
      xp: 223.2
  # REPAIR — fires when the player repairs an item on an anvil
  REPAIR:
    IRON_SWORD:
      money: 3.55
      xp: 18.6
    IRON_PICKAXE:
      money: 3.55
      xp: 18.6
    DIAMOND_SWORD:
      money: 22.58
      xp: 93.0
    DIAMOND_PICKAXE:
      money: 22.58
      xp: 93.0

# Income multiplier bonus at milestone levels (e.g. 0.05 = +5% earnings)
perks:
  25: 0.05
  50: 0.10
  75: 0.10
  100: 0.15

# Daily quest pool. weight = relative draw chance (higher = more common).
quests:
  - id: weaponsmith_iron_sword
    description: "Craft 5 iron swords"
    action: CRAFT
    material: IRON_SWORD
    amount: 5
    reward-money: 222.50
    reward-xp: 697.5
    weight: 5
    enabled: true
  - id: weaponsmith_iron_armor
    description: "Craft 3 iron chestplates"
    action: CRAFT
    material: IRON_CHESTPLATE
    amount: 3
    reward-money: 267.14
    reward-xp: 837.0
    weight: 4
    enabled: true
  - id: weaponsmith_diamond
    description: "Craft 1 diamond sword"
    action: CRAFT
    material: DIAMOND_SWORD
    amount: 1
    reward-money: 445.01
    reward-xp: 1395.0
    weight: 2
    enabled: true
