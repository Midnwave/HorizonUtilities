# ─────────────────────────────────────────────────────────────────────────────
# HorizonUtilities Job — Fisherman
# Earn money and XP from every fishing catch, including junk and treasure.
# Global job settings live in jobs-config.yml.
# ─────────────────────────────────────────────────────────────────────────────

display-name: "Fisherman"
icon: FISHING_ROD
description: "Fish for profit and rare catches"
max-level: 100
hourly-income-cap: -1

actions:
  FISH:
    COD:
      money: 2.37
      xp: 14.0
    SALMON:
      money: 3.55
      xp: 18.6
    TROPICAL_FISH:
      money: 7.11
      xp: 32.6
    PUFFERFISH:
      money: 10.68
      xp: 41.9
    # Junk catches — low reward
    LEATHER:
      money: 1.79
      xp: 9.3
    STICK:
      money: 0.58
      xp: 3.7
    STRING:
      money: 1.19
      xp: 5.6
    LILY_PAD:
      money: 1.79
      xp: 7.4
    # Treasure catches — high reward
    SADDLE:
      money: 47.57
      xp: 148.8
    NAME_TAG:
      money: 71.28
      xp: 186.0

# Income multiplier bonus at milestone levels (e.g. 0.05 = +5% earnings)
perks:
  25: 0.05
  50: 0.10
  75: 0.10
  100: 0.15

# Daily quest pool. weight = relative draw chance (higher = more common).
quests:
  - id: fisherman_cod
    description: "Catch 20 cod"
    action: FISH
    material: COD
    amount: 20
    reward-money: 106.72
    reward-xp: 334.8
    weight: 5
    enabled: true
  - id: fisherman_salmon
    description: "Catch 10 salmon"
    action: FISH
    material: SALMON
    amount: 10
    reward-money: 142.52
    reward-xp: 446.4
    weight: 4
    enabled: true
  - id: fisherman_tropical
    description: "Catch 5 tropical fish"
    action: FISH
    material: TROPICAL_FISH
    amount: 5
    reward-money: 213.44
    reward-xp: 669.6
    weight: 3
    enabled: true
