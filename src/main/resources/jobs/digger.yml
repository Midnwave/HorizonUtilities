# ─────────────────────────────────────────────────────────────────────────────
# HorizonUtilities Job — Digger
# Earn money and XP by excavating dirt, sand, gravel, and similar blocks.
# Global job settings live in jobs-config.yml.
# ─────────────────────────────────────────────────────────────────────────────

display-name: "Digger"
icon: IRON_SHOVEL
description: "Excavate dirt, sand, and gravel"
max-level: 100
hourly-income-cap: -1

actions:
  BREAK:
    DIRT:
      money: 0.58
      xp: 3.7
    GRASS_BLOCK:
      money: 0.58
      xp: 3.7
    SAND:
      money: 1.19
      xp: 5.6
    RED_SAND:
      money: 1.19
      xp: 5.6
    GRAVEL:
      money: 1.79
      xp: 7.4
    CLAY:
      money: 2.96
      xp: 11.2
    SOUL_SAND:
      money: 3.55
      xp: 14.9
    SOUL_SOIL:
      money: 3.55
      xp: 14.9
    MYCELIUM:
      money: 4.17
      xp: 16.7
    PODZOL:
      money: 2.37
      xp: 9.3
    COARSE_DIRT:
      money: 0.88
      xp: 4.7
    ROOTED_DIRT:
      money: 1.79
      xp: 7.4

# Income multiplier bonus at milestone levels (e.g. 0.05 = +5% earnings)
perks:
  25: 0.05
  50: 0.10
  75: 0.10
  100: 0.15

# Daily quest pool. weight = relative draw chance (higher = more common).
quests:
  - id: digger_dirt
    description: "Dig 256 dirt or grass"
    action: BREAK
    material: DIRT
    amount: 256
    reward-money: 89.51
    reward-xp: 279.0
    weight: 5
    enabled: true
  - id: digger_sand
    description: "Dig 128 sand"
    action: BREAK
    material: SAND
    amount: 128
    reward-money: 118.81
    reward-xp: 372.0
    weight: 4
    enabled: true
  - id: digger_clay
    description: "Dig 64 clay"
    action: BREAK
    material: CLAY
    amount: 64
    reward-money: 177.86
    reward-xp: 558.0
    weight: 3
    enabled: true
