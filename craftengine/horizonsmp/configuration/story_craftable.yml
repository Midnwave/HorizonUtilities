recipes:
  # Warden's Key: Shaped — Insignia top, Ashen Stone center, 2x Crying Obsidian sides
  horizonsmp:wardens_key:
    type: shaped
    pattern:
      - " A "
      - "CBC"
      - "   "
    ingredients:
      A: horizonsmp:vareths_insignia
      B: horizonsmp:ashen_stone
      C: minecraft:crying_obsidian
    result:
      id: horizonsmp:wardens_key
      count: 1

  # Ashen Dust: Shapeless — 1 Ashen Stone → 4 Ashen Dust
  horizonsmp:ashen_dust:
    type: shapeless
    ingredients:
      A: horizonsmp:ashen_stone
    result:
      id: horizonsmp:ashen_dust
      count: 4

  # Vigil Crystal: Shaped cross — 5 Vigil Shards
  horizonsmp:vigil_crystal:
    type: shaped
    pattern:
      - " A "
      - "AAA"
      - " A "
    ingredients:
      A: horizonsmp:vigil_shard
    result:
      id: horizonsmp:vigil_crystal
      count: 1

  # Veilborn Torch: Shaped vertical — Ashen Dust + Soul Sand + Stick → 4
  horizonsmp:veilborn_torch:
    type: shaped
    pattern:
      - "A"
      - "B"
      - "C"
    ingredients:
      A: horizonsmp:ashen_dust
      B: minecraft:soul_sand
      C: minecraft:stick
    result:
      id: horizonsmp:veilborn_torch
      count: 4

  # Hollow Ward Charm: Shaped — 3 Ashen Dust + 2 Gold Nugget + 1 Crying Obsidian
  horizonsmp:hollow_ward_charm:
    type: shaped
    pattern:
      - "AAA"
      - "BCB"
      - "   "
    ingredients:
      A: horizonsmp:ashen_dust
      B: minecraft:gold_nugget
      C: minecraft:crying_obsidian
    result:
      id: horizonsmp:hollow_ward_charm
      count: 1
